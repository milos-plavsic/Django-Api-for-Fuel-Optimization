<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Route Optimizer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #f4f4f9;
        }
        #sidebar {
            width: 350px;
            background: white;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        #map {
            flex-grow: 1;
        }
        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #results {
            margin-top: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .summary-card {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .stop-card {
            background: white;
            border: 1px solid #eee;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 4px solid #007bff;
        }
        .stop-name {
            font-weight: bold;
            color: #333;
        }
        .stop-price {
            color: #28a745;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>Route Optimizer</h1>
        <form id="optimizer-form">
            <div class="form-group">
                <label for="start">Start Location</label>
                <input type="text" id="start" placeholder="e.g. New York, NY" required>
            </div>
            <div class="form-group">
                <label for="finish">Finish Location</label>
                <input type="text" id="finish" placeholder="e.g. Los Angeles, CA" required>
            </div>
            <button type="submit">Optimize Route</button>
        </form>

        <div id="loading" class="loading">Optimizing... Please wait.</div>

        <div id="results">
            <!-- Results will be injected here -->
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([39.8283, -98.5795], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let routeLayer;
        let stopMarkers = [];

        document.getElementById('optimizer-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const start = document.getElementById('start').value;
            const finish = document.getElementById('finish').value;
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            loading.style.display = 'block';
            results.innerHTML = '';
            if (routeLayer) map.removeLayer(routeLayer);
            stopMarkers.forEach(m => map.removeLayer(m));
            stopMarkers = [];

            try {
                const response = await fetch(`/api/route/?start=${encodeURIComponent(start)}&finish=${encodeURIComponent(finish)}`);
                const data = await response.json();

                if (response.ok) {
                    // Draw Route
                    routeLayer = L.geoJSON(data.route, {
                        style: { color: '#007bff', weight: 5, opacity: 0.7 }
                    }).addTo(map);
                    map.fitBounds(routeLayer.getBounds());

                    // Add Markers
                    data.fuel_stops.forEach(stop => {
                        if (stop.latitude && stop.longitude) {
                            const marker = L.marker([stop.latitude, stop.longitude])
                                .bindPopup(`
                                    <b>${stop.name}</b><br>
                                    ${stop.address}<br>
                                    Price: $${stop.price.toFixed(2)}/gal
                                `)
                                .addTo(map);
                            stopMarkers.push(marker);
                        }
                    });

                    // Display Summary
                    results.innerHTML = `
                        <div class="summary-card">
                            <div class="summary-item"><span>Total Distance:</span> <span>${data.total_distance_miles.toFixed(1)} mi</span></div>
                            <div class="summary-item"><span>Total Fuel Cost:</span> <span>$${data.total_fuel_cost.toFixed(2)}</span></div>
                        </div>
                        <h3>Recommended Fuel Stops</h3>
                        ${data.fuel_stops.map(stop => `
                            <div class="stop-card">
                                <div class="stop-name">${stop.name}</div>
                                <div>${stop.address}, ${stop.city}, ${stop.state}</div>
                                <div class="stop-price">$${stop.price.toFixed(2)} / gal</div>
                                <div style="font-size: 0.8rem; color: #777;">At ${stop.distance_along_route.toFixed(1)} mi</div>
                            </div>
                        `).join('')}
                    `;
                } else {
                    results.innerHTML = `<div style="color: red;">Error: ${data.error}</div>`;
                }
            } catch (error) {
                results.innerHTML = `<div style="color: red;">An unexpected error occurred.</div>`;
            } finally {
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
