services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
      DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
      DJANGO_CACHE_LOCATION: redis://redis:6379/1
      OSRM_BASE_URL: http://osrm:5000
    ports:
      - "8000:8000"
    volumes:
      - fuelplanner-data:/app/data
    depends_on:
      - redis
      - osrm
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --save 60 1 --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped

  osrm:
    image: osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld /data/us-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data
    restart: unless-stopped

volumes:
  fuelplanner-data:
  redis-data:
